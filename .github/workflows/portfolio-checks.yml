name: Portfolio checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation
        run: python tools/check_links.py
      - name: Test authentication analysis
        run: python -m unittest discover -s integrated-security-case/tests -v
      - name: Run SQL case
        run: python tools/run_sql_case.py
